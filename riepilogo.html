<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricognizione Alloggiativa 233° Corso — Silp Cgil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1a1a1a;min-height:100vh}

.topbar{background:#005CA9;padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.topbar-title{color:#fff;font-size:16px;font-weight:500}
.topbar-sub{color:rgba(255,255,255,.7);font-size:12px;margin-top:2px}
.topbar-stats{text-align:right;color:rgba(255,255,255,.85);font-size:12px}
.topbar-stats strong{color:#fff;font-size:18px;display:block}

.main{max-width:1000px;margin:0 auto;padding:1.25rem}

.section-title{font-size:13px;font-weight:500;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.6rem}

.compiled-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:1.5rem}
.pcard{background:#fff;border:0.5px solid #dde;border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:#005CA9;box-shadow:0 2px 8px rgba(0,92,169,.12)}
.pcard.active{border:2px solid #005CA9;background:#EBF4FF}
.pcard-name{font-size:13px;font-weight:500;color:#1a1a1a}
.pcard-meta{font-size:11px;color:#999;margin-top:2px}
.pcard-badge{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

.pending-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:1.5rem}
.pending-item{background:#fff;border:0.5px solid #eee;border-radius:6px;padding:8px 10px;font-size:12px;color:#aaa}

.detail{background:#fff;border:0.5px solid #dde;border-radius:12px;padding:1.25rem;margin-bottom:1.5rem}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem}
.detail-prov{font-size:20px;font-weight:500;color:#1a1a1a}
.detail-meta{font-size:12px;color:#999;margin-top:3px}
.close-btn{border:0.5px solid #ccc;background:none;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;color:#555}
.close-btn:hover{border-color:#005CA9;color:#005CA9}

.rep-list{width:100%}
.cat-header{font-size:11px;font-weight:500;color:#999;text-transform:uppercase;letter-spacing:.06em;padding:10px 0 4px;border-bottom:1px solid #f0f0f0;margin-bottom:4px}
.rep-row{display:flex;align-items:center;padding:8px 0;border-bottom:0.5px solid #f8f8f8;gap:8px}
.rep-row:last-child{border-bottom:none}
.rep-name{flex:1;font-size:13px;color:#1a1a1a}
.rep-badge{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:500;white-space:nowrap}
.b-apm{background:#EAF3DE;color:#3B6D11}
.b-ap{background:#E6F1FB;color:#185FA5}
.b-hpm{background:#DDEBF7;color:#185FA5}
.b-hp{background:#FAEEDA;color:#854F0B}
.b-empty{background:#f5f5f5;color:#bbb}
.rep-an{font-size:11px;color:#aaa;min-width:90px;text-align:right}
.dis-badge{display:inline-block;background:#FFE033;color:#000;font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px;margin-left:4px;vertical-align:middle}
.rep-row.disagiata{background:#FFFDE7;border-radius:6px;padding:8px 8px}

.note-box{margin-top:1rem;background:#f8f9fb;border-left:3px solid #005CA9;border-radius:0 6px 6px 0;padding:10px 14px;font-size:13px;color:#555;line-height:1.6}

.loading{text-align:center;padding:2rem;color:#999;font-size:14px}
.error{color:#c0392b;font-size:13px;padding:1rem;background:#fef5f5;border-radius:8px}

.dot-apm{background:#3B6D11}
.dot-ap{background:#185FA5}
.dot-hp,.dot-hpm{background:#854F0B}
.dot-empty{background:#ccc}

@media(max-width:600px){
  .compiled-grid,.pending-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">Ricognizione Alloggiativa — 233° Corso Allievi Agenti</div>
    <div class="topbar-sub">Silp Cgil — Coordinamento Nazionale Scuole di Polizia</div>
  </div>
  <div class="topbar-stats">
    <strong id="s-compiled">—</strong>
    province su 106 compilate
  </div>
</div>

<div class="main">

  <div id="detail-panel"></div>

  <div class="section-title" id="label-compiled">Province che hanno compilato (—)</div>
  <div class="compiled-grid" id="compiled-grid"><div class="loading">Caricamento...</div></div>

  <div class="section-title" id="label-pending">Province ancora mancanti (—)</div>
  <div class="pending-grid" id="pending-grid"></div>

</div>

<div style="position:fixed;bottom:8px;right:10px;font-size:10px;color:#bbb;pointer-events:none">rev 2</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTrTBe54ad0ugFLtatB05jDzXO_MW4U1J2o4jGAJbGVe85pBbdpCR1n-hWE3t7se8xvWkCq0hbXrssx/pub?gid=97110302&single=true&output=csv';

const TUTTE_PROVINCE = ["Agrigento","Alessandria","Ancona","Aosta","Arezzo","Ascoli Piceno","Asti","Avellino","Bari","Barletta-Andria-Trani","Belluno","Benevento","Bergamo","Biella","Bologna","Bolzano","Brescia","Brindisi","Cagliari","Caltanissetta","Campobasso","Caserta","Catania","Catanzaro","Chieti","Como","Cosenza","Cremona","Crotone","Cuneo","Enna","Fermo","Ferrara","Firenze","Foggia","Forlì-Cesena","Frosinone","Genova","Gorizia","Grosseto","Imperia","Isernia","La Spezia","L'Aquila","Latina","Lecce","Lecco","Livorno","Lodi","Lucca","Macerata","Mantova","Massa-Carrara","Matera","Messina","Milano","Modena","Monza e Brianza","Napoli","Novara","Nuoro","Oristano","Padova","Palermo","Parma","Pavia","Perugia","Pesaro e Urbino","Pescara","Piacenza","Pisa","Pistoia","Pordenone","Potenza","Prato","Ragusa","Ravenna","Reggio Calabria","Reggio Emilia","Rieti","Rimini","Roma","Rovigo","Salerno","Sassari","Savona","Siena","Siracusa","Sondrio","Sud Sardegna","Taranto","Teramo","Terni","Torino","Trapani","Trento","Treviso","Trieste","Udine","Varese","Venezia","Verbano-Cusio-Ossola","Vercelli","Verona","Vibo Valentia","Vicenza","Viterbo"];

const DIS_KW = ['commissariato distaccato','distaccamento di polizia stradale','sottosez','nucleo artificieri','reparto volo','squadra cinofili','frontiera c/o scalo','barga','gela','niscemi','cortina','palma di montechiaro','roghudi','valico','traforo','autostradale'];

const CAT_ORDER = ['Questura','Commissariato','Polizia Stradale','Distaccamento Stradale','Polfer','Polizia Ferroviaria','Frontiera','Scuola di Polizia','DIA','SISCO','Nucleo PG / Procura','Reparti Speciali'];

let allData = [];
let selected = null;

function parseCSV(text){
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line=>{
    const cols=[]; let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;continue;}
      if(c===','&&!inQ){cols.push(cur.trim());cur='';continue;}
      cur+=c;
    }
    cols.push(cur.trim());
    return cols;
  }).filter(r=>r.length>=3&&r[0]&&r[0].trim());
}

function parseItDate(s){
  const m=(s||'').match(/(\d{2})\/(\d{2})\/(\d{4}),?\s*(\d{2}):(\d{2}):(\d{2})/);
  if(!m) return 0;
  return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+m[6]).getTime();
}

function tipoInfo(raw){
  const l=(raw||'').toLowerCase();
  if(l.includes('hotel')){
    return l.includes('anche oltre')?{cls:'hpm',label:'Hotel — anche oltre il periodo di prova'}:{cls:'hp',label:'Hotel — solo periodo di prova'};
  }
  if(l.includes('alloggio')){
    return l.includes('anche oltre')?{cls:'apm',label:'Alloggio servizio — anche oltre il periodo di prova'}:{cls:'ap',label:'Alloggio servizio — solo periodo di prova'};
  }
  return {cls:'empty',label:raw||'—'};
}

function dispText(s){
  s=(s||'').trim();
  if(!s) return '—';
  if(/^n\.?\s*specifico/i.test(s)) return s.replace(/^n\.?\s*specifico:?\s*/i,'N. ');
  if(/limitato/i.test(s)) return 'Limitato';
  return s;
}

function isDis(label){
  const l=(label||'').toLowerCase();
  return DIS_KW.some(k=>l.includes(k));
}

function catRank(c){
  const i=CAT_ORDER.indexOf(c);
  return i===-1?999:i;
}

function dominantCls(reparti){
  const c={};
  reparti.forEach(x=>{const info=tipoInfo(x.tipoRaw);c[info.cls]=(c[info.cls]||0)+1;});
  const entries=Object.entries(c);
  if(!entries.length)return 'empty';
  return entries.sort((a,b)=>b[1]-a[1])[0][0];
}

function loadData(){
  fetch(SHEET_URL)
    .then(r=>r.text())
    .then(text=>{
      const rows=parseCSV(text).map(r=>{
        const data=(r[6]||'').trim();
        return {
          prov:(r[0]||'').trim(),
          cat:(r[1]||'').trim()||'Altro',
          ufficio:(r[2]||'').trim(),
          tipoRaw:(r[3]||'').trim(),
          disp:(r[4]||'').trim(),
          compilatore:(r[5]||'').trim(),
          data,
          ts:parseItDate(data)
        };
      }).filter(r=>r.prov);

      // Sovrascrittura: per ogni provincia tengo solo le righe della compilazione più recente
      const latestTs={};
      rows.forEach(r=>{if(!(r.prov in latestTs)||r.ts>latestTs[r.prov])latestTs[r.prov]=r.ts;});
      const filtered=rows.filter(r=>r.ts===latestTs[r.prov]);

      const map={};
      filtered.forEach(r=>{
        if(!map[r.prov])map[r.prov]={prov:r.prov,compilatore:r.compilatore,data:r.data,reparti:[]};
        if(r.compilatore)map[r.prov].compilatore=r.compilatore;
        if(r.data)map[r.prov].data=r.data;
        map[r.prov].reparti.push(r);
      });
      allData=Object.values(map);

      document.getElementById('s-compiled').textContent=allData.length;
      document.getElementById('label-compiled').textContent='Province che hanno compilato ('+allData.length+')';

      const compilate=new Set(allData.map(d=>d.prov));
      const mancanti=TUTTE_PROVINCE.filter(p=>!compilate.has(p));
      document.getElementById('label-pending').textContent='Province ancora mancanti ('+mancanti.length+')';

      renderCompiled();
      renderPending(mancanti);
    })
    .catch(()=>{
      document.getElementById('compiled-grid').innerHTML='<div class="error">Errore nel caricamento. Ricarica la pagina.</div>';
    });
}

function renderCompiled(){
  const grid=document.getElementById('compiled-grid');
  if(!allData.length){grid.innerHTML='<div class="loading">Nessuna provincia ha compilato.</div>';return;}
  const sorted=[...allData].sort((a,b)=>a.prov.localeCompare(b.prov,'it'));
  grid.innerHTML=sorted.map(d=>{
    const dotClass='dot-'+dominantCls(d.reparti);
    const cognome=d.compilatore.trim().split(/\s+/).slice(-1)[0]||'';
    return `<div class="pcard${selected===d.prov?' active':''}" onclick="showDetail('${d.prov.replace(/'/g,"\\'")}')">
      <div class="pcard-name"><span class="pcard-badge ${dotClass}"></span>${d.prov}</div>
      <div class="pcard-meta">${d.reparti.length} reparti · ${cognome}</div>
    </div>`;
  }).join('');
}

function renderPending(mancanti){
  const grid=document.getElementById('pending-grid');
  grid.innerHTML=mancanti.sort((a,b)=>a.localeCompare(b,'it')).map(p=>`<div class="pending-item">${p}</div>`).join('');
}

function showDetail(prov){
  selected=prov;
  const d=allData.find(x=>x.prov===prov);
  if(!d)return;
  renderCompiled();

  const cats={};
  d.reparti.forEach(r=>{if(!cats[r.cat])cats[r.cat]=[];cats[r.cat].push(r);});
  const catKeys=Object.keys(cats).sort((a,b)=>catRank(a)-catRank(b)||a.localeCompare(b,'it'));

  let html='';
  catKeys.forEach(cat=>{
    html+=`<div class="cat-header">${cat}</div>`;
    cats[cat].forEach(r=>{
      const info=tipoInfo(r.tipoRaw);
      const dis=isDis(r.ufficio);
      const disBadge=dis?'<span class="dis-badge">Disagiata</span>':'';
      html+=`<div class="rep-row${dis?' disagiata':''}">
        <div class="rep-name">${r.ufficio}${disBadge}</div>
        <span class="rep-badge b-${info.cls}">${info.label}</span>
        <div class="rep-an">${dispText(r.disp)}</div>
      </div>`;
    });
  });

  document.getElementById('detail-panel').innerHTML=`
    <div class="detail">
      <div class="detail-header">
        <div>
          <div class="detail-prov">${d.prov}</div>
          <div class="detail-meta">Compilato da <strong>${d.compilatore}</strong> · ${d.data}</div>
        </div>
        <button class="close-btn" onclick="closeDetail()">✕ chiudi</button>
      </div>
      <div class="rep-list">${html}</div>
    </div>`;

  window.scrollTo({top:0,behavior:'smooth'});
}

function closeDetail(){
  selected=null;
  document.getElementById('detail-panel').innerHTML='';
  renderCompiled();
}

loadData();
</script>
</body>
</html>
